services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mini_store}
      MYSQL_USER: ${DB_USERNAME:-mini_store}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD before starting}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY before starting}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mini_store}
      DB_USERNAME: ${DB_USERNAME:-mini_store}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting}
      SESSION_DRIVER: file
      CACHE_STORE: file
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8000:80"
    volumes:
      - backend-storage:/var/www/html/storage

  frontend:
    build:
      context: ./fontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mysql-data:
  backend-storage:
